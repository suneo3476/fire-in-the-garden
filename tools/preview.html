<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire in the Garden - 素材管理プレビューツール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 0.95em;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
            overflow-x: auto;
        }

        .tab {
            padding: 15px 25px;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .tab:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .tab.active {
            background: white;
            border-bottom: 3px solid #667eea;
            color: #667eea;
        }

        .content {
            padding: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .asset-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s;
            background: #fafafa;
        }

        .asset-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .asset-card.assigned {
            border-color: #4caf50;
            background: #f1f8f4;
        }

        .asset-card h3 {
            font-size: 1.1em;
            margin-bottom: 10px;
            color: #333;
        }

        .asset-card .description {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .asset-card .file-path {
            font-size: 0.85em;
            color: #999;
            font-family: monospace;
            background: #f5f5f5;
            padding: 5px 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .asset-card .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .status.未配置 {
            background: #ffebee;
            color: #c62828;
        }

        .status.配置済み {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .preview-area {
            margin-top: 10px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            position: relative;
            overflow: hidden;
        }

        .preview-area img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }

        .preview-area.empty {
            color: #999;
            font-size: 0.9em;
        }

        .drop-zone {
            border: 2px dashed #667eea;
            background: rgba(102, 126, 234, 0.05);
            cursor: pointer;
        }

        .drop-zone:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .stat-item {
            flex: 1;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .instructions {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .instructions h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        .instructions ul {
            margin-left: 20px;
            color: #856404;
        }

        .instructions li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 Fire in the Garden</h1>
            <p>素材管理プレビューツール - どの素材をどこに使うか自由に設定できます</p>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="characters">キャラクター立ち絵</button>
            <button class="tab" data-tab="backgrounds">背景</button>
            <button class="tab" data-tab="evidence">証拠品</button>
            <button class="tab" data-tab="ui">UI素材</button>
            <button class="tab" data-tab="bgm">BGM</button>
            <button class="tab" data-tab="sfx">効果音</button>
        </div>

        <div class="content">
            <div class="instructions">
                <h3>📝 使い方</h3>
                <ul>
                    <li>各タブで素材の割り当て状況を確認できます</li>
                    <li>画像ファイルをドロップエリアにドラッグ&ドロップすると、プレビュー表示されます</li>
                    <li>「保存」ボタンで変更をダウンロード（将来実装予定）</li>
                    <li>素材は後からいつでも差し替え可能です</li>
                </ul>
            </div>

            <div class="stats" id="stats">
                <div class="stat-item">
                    <div class="stat-value" id="total-assets">0</div>
                    <div class="stat-label">総素材数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="assigned-assets">0</div>
                    <div class="stat-label">配置済み</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="unassigned-assets">0</div>
                    <div class="stat-label">未配置</div>
                </div>
            </div>

            <div id="characters" class="tab-content active">
                <h2>キャラクター立ち絵</h2>
                <div class="asset-grid" id="characters-grid"></div>
            </div>

            <div id="backgrounds" class="tab-content">
                <h2>背景</h2>
                <div class="asset-grid" id="backgrounds-grid"></div>
            </div>

            <div id="evidence" class="tab-content">
                <h2>証拠品画像</h2>
                <div class="asset-grid" id="evidence-grid"></div>
            </div>

            <div id="ui" class="tab-content">
                <h2>UI素材</h2>
                <div class="asset-grid" id="ui-grid"></div>
            </div>

            <div id="bgm" class="tab-content">
                <h2>BGM</h2>
                <div class="asset-grid" id="bgm-grid"></div>
            </div>

            <div id="sfx" class="tab-content">
                <h2>効果音</h2>
                <div class="asset-grid" id="sfx-grid"></div>
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="save-btn">💾 変更を保存（JSON出力）</button>
                <button class="btn btn-secondary" id="reload-btn">🔄 リロード</button>
            </div>
        </div>
    </div>

    <script>
        let assetMapping = {};

        // JSONデータを読み込む
        async function loadAssetMapping() {
            try {
                const response = await fetch('../src/domain/assets-mapping.json');
                assetMapping = await response.json();
                renderAllCategories();
                updateStats();
            } catch (error) {
                console.error('Failed to load assets-mapping.json:', error);
                alert('assets-mapping.jsonの読み込みに失敗しました。\nファイルが存在するか確認してください。');
            }
        }

        // すべてのカテゴリをレンダリング
        function renderAllCategories() {
            renderCategory('characters', assetMapping.characters);
            renderCategory('backgrounds', assetMapping.backgrounds);
            renderCategory('evidence', assetMapping.evidence);
            renderCategory('ui', assetMapping.ui);
            renderCategory('bgm', assetMapping.bgm);
            renderCategory('sfx', assetMapping.sfx);
        }

        // カテゴリごとにカードを生成
        function renderCategory(categoryId, items) {
            const grid = document.getElementById(`${categoryId}-grid`);
            grid.innerHTML = '';

            for (const [key, asset] of Object.entries(items)) {
                const card = createAssetCard(categoryId, key, asset);
                grid.appendChild(card);
            }
        }

        // アセットカードを作成
        function createAssetCard(category, key, asset) {
            const card = document.createElement('div');
            card.className = `asset-card ${asset.status === '配置済み' ? 'assigned' : ''}`;

            const isImage = category === 'characters' || category === 'backgrounds' || category === 'evidence' || category === 'ui';

            card.innerHTML = `
                <h3>${asset.name}</h3>
                <div class="description">${asset.description}</div>
                <div class="file-path">${asset.filePath}</div>
                <span class="status ${asset.status}">${asset.status}</span>
                ${isImage ? `
                    <div class="preview-area ${asset.status === '未配置' ? 'empty drop-zone' : ''}" data-category="${category}" data-key="${key}">
                        ${asset.status === '未配置' ? 'ここに画像ファイルをドロップ' : `<img src="../${asset.filePath}" alt="${asset.name}" onerror="this.parentElement.innerHTML='画像が見つかりません';">`}
                    </div>
                ` : ''}
                ${asset.source ? `<div class="description" style="margin-top: 10px;">出典: ${asset.source}</div>` : ''}
            `;

            // ドラッグ&ドロップ機能
            if (isImage) {
                const dropZone = card.querySelector('.preview-area');
                setupDropZone(dropZone, category, key);
            }

            return card;
        }

        // ドラッグ&ドロップ機能を設定
        function setupDropZone(element, category, key) {
            element.addEventListener('dragover', (e) => {
                e.preventDefault();
                element.style.borderColor = '#667eea';
            });

            element.addEventListener('dragleave', () => {
                element.style.borderColor = '#ddd';
            });

            element.addEventListener('drop', (e) => {
                e.preventDefault();
                element.style.borderColor = '#ddd';

                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    const file = files[0];
                    if (file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            element.innerHTML = `<img src="${event.target.result}" alt="Preview">`;
                            element.classList.remove('empty', 'drop-zone');

                            // ステータスを更新
                            assetMapping[category][key].status = '配置済み';
                            updateStats();
                        };
                        reader.readAsDataURL(file);
                    } else {
                        alert('画像ファイルをドロップしてください');
                    }
                }
            });
        }

        // 統計情報を更新
        function updateStats() {
            let total = 0;
            let assigned = 0;

            for (const category of ['characters', 'backgrounds', 'evidence', 'ui', 'bgm', 'sfx']) {
                const items = assetMapping[category];
                for (const asset of Object.values(items)) {
                    total++;
                    if (asset.status === '配置済み') {
                        assigned++;
                    }
                }
            }

            document.getElementById('total-assets').textContent = total;
            document.getElementById('assigned-assets').textContent = assigned;
            document.getElementById('unassigned-assets').textContent = total - assigned;
        }

        // タブ切り替え
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                tab.classList.add('active');
                const targetId = tab.dataset.tab;
                document.getElementById(targetId).classList.add('active');
            });
        });

        // 保存ボタン
        document.getElementById('save-btn').addEventListener('click', () => {
            const dataStr = JSON.stringify(assetMapping, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'assets-mapping-updated.json';
            a.click();
            URL.revokeObjectURL(url);
            alert('変更をダウンロードしました！\n元のファイル（assets-mapping.json）を上書きしてください。');
        });

        // リロードボタン
        document.getElementById('reload-btn').addEventListener('click', () => {
            location.reload();
        });

        // 初期化
        loadAssetMapping();
    </script>
</body>
</html>
